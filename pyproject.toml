[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vineclim"
version = "0.1.0"
description = "Bioclimatic indices and reproducible reports for high-altitude vineyards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "uppercrusteve", email = "uppercrusteve@users.noreply.github.com" }]
keywords = [
    "viticulture",
    "bioclimatic-indices",
    "huglin",
    "growing-degree-days",
    "nasa-power",
    "high-altitude",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
vineclim = "vineclim.cli:main"

[project.urls]
Homepage = "https://github.com/uppercrusteve/vineclim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vineclim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
